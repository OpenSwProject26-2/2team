# 운영자 대시보드 실행(입력 → 조립 → 파이프라인 → 곡선 → 확정)이 읽는 로컬 경로.
# 이 파일을 config/local_paths.toml로 복사해 PC에 맞게 고친다. local_paths.toml은 커밋하지 않는다(.gitignore).
# 데이터·실행 결과·확정 묶음은 모두 저장소 밖에 둔다. {gu}는 구 영문 ID(guro 등)로 바뀐다.

[paths]
# region_all/<구>_0610_v4, osm/<구>_roads.json, routegen_v2/facilities/facilities_seoul.csv 가 있는 작업 폴더
work_root = "/path/to/guro_exp_work"
# 원본 묶음(bundles_v4/split/<구>_0610_v4.zip). 크기·해시 기록용, 열지 않는다. 없으면 비워 둔다
transit_data = "/path/to/seoul_transit_data"
# 실행 결과: <pareto_root>/<구>/runs/<run_id>/(pareto.json, export/). 기존 <pareto_root>/<구>/pareto.json도 그대로 읽는다
pareto_root = "/path/to/e2e/pareto_root"
# 확정 묶음: <confirm_root>/<구>/<confirm_id>/, <confirm_root>/<구>/CURRENT (시민 길찾기 쪽과 같은 경로)
confirm_root = "/path/to/e2e/confirm_root"
# "전체" 설정의 미리 계산된 결과(요인 실험 factorial_1126 등, <구>/pareto.json). 없으면 비워 둔다
precomputed_root = ""
# 우리 안 망(net/road.json·turns.json, hub_sweep.json)과 지자체안 변환본(plan.json, road_muni.json)
sweep = "/path/to/guro_exp_work/routegen_integrated/improve_1122/final/all25/{gu}/sweep"
muni = "/path/to/guro_exp_work/routegen_integrated/improve_1122/final/all25/{gu}/muni07"

[citizen]
# 프롬프트 B의 POST /api/citizen-routing/apply 가 있는 시민 서버 주소. 비우면 "시민 경로 반영 대기"로만 표시한다
api = ""
# "시민 경로 화면 열기" 단추가 여는 주소
ui = ""

[run]
# 파이프라인 동시 실행 수(생성·배분, 평가 묶음). 3을 넘기지 않는다
par = 3
eval_groups = 3
